name: Offline verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rebuild and verify all 19 offline stages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up CPython 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned verification dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Rebuild and run offline verification
        run: python tools/reproduce.py

      - name: Check evidence and committed candidate hashes
        run: python tools/check_reproduction.py --check-committed
